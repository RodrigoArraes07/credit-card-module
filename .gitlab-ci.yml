image: maven:3.9.6-eclipse-temurin-17

stages:
  - build
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"
  GITLAB_PRIVATE_TOKEN: $GITLAB_PRIVATE_TOKEN

#Config dependeces in cache m2
cache:
  paths:
    - .m2/repository

before_script:
  - apt-get update -y
  - apt-get install -y libgtk-3-0 libgtk-3-dev libx11-dev libxtst-dev libxrender-dev libxi6 libxrandr2

build-job:
  stage: build
  script:
    - echo -e "\e[34m====== BUILD STAGE STARTED ======\e[0m"
    - mvn -B clean install --settings ci_settings.xml
  artifacts:
    paths:
      - target/

test-job:
  stage: test
  script:
    - echo -e "\e[34m=== TEST STAGE STARTED ===\e[0m"
    - mvn test

package-job:
  stage: package
  script:
    - echo -e "\e[34m=== PACKAGE STAGE STARTED ===\e[0m"
    - mvn -B package
  artifacts:
    paths:
      - target/*.jar
