image: maven:3.9.6-eclipse-temurin-17

stages:
  - build
  - test
  - package



variables:
  MAVEN_OPTS: >-
    MAVEN_OPTS: "-Dmaven.repo.local=.m2"

  MAVEN_CLI_OPTS: >-
    -B
    -q
    --fail-at-end
    --no-transfer-progress
    -DinstallAtEnd=true
    -DdeployAtEnd=true
    --settings ci_settings.xml

#Config dependeces in cache m2
cache:
  paths:
    - .m2/repository

before_script:
  - apt-get update -y
  - apt-get install -y libgtk-3-0 libgtk-3-dev libx11-dev libxtst-dev libxrender-dev libxi6 libxrandr2

build-job:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -B clean compile
  artifacts:
    paths:
      - target/

test-job:
  stage: test
  script:
    - echo -e "\e[34m=== TEST STAGE STARTED ===\e[0m"
    - mvn $MAVEN_CLI_OPTS test

package-job:
  stage: package
  script:
    - echo -e "\e[34m=== PACKAGE STAGE STARTED ===\e[0m"
    - mvn $MAVEN_CLI_OPTS -B package
  artifacts:
    paths:
      - target/*.jar